name: Update Profile Art

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch latest contributions
        env:
          GH_PROFILE_USER: exi-0
        run: |
          python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution heatmap [skip ci]" && git push)
